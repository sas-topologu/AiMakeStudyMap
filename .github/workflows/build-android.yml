# 自动构建「手机客户端 APK」（GitHub 云端构建，无需你本地装 Android SDK）
# 触发方式：仓库页面 → Actions → 选 “Build Android APK” → Run workflow → 跑完在该次运行里下载 APK
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      terminal_url:
        description: '客户端默认指向的终端地址（留空则用仓库变量 TERMINAL_URL / 默认线上地址）'
        required: false
        default: ''

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Capacitor 8 需要 Android SDK Platform 36
      ANDROID_PLATFORM: '36'
      BUILD_TOOLS: '36.0.0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: 安装 Android SDK 组件（API 36）并接受许可
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-${ANDROID_PLATFORM}" "build-tools;${BUILD_TOOLS}"
          echo "=== 已安装组件 ==="
          sdkmanager --list_installed || true
          echo "=== 环境 ==="
          node -v && java -version 2>&1 | head -1

      - name: 安装依赖（跳过 Electron 大文件下载）
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: 写入终端地址并构建前端
        env:
          INPUT_URL: ${{ github.event.inputs.terminal_url }}
          VAR_URL: ${{ vars.TERMINAL_URL }}
        run: |
          URL="${INPUT_URL:-${VAR_URL:-https://aimakestudymap.online}}"
          echo "客户端默认指向：$URL"
          echo "VITE_TERMINAL_URL=$URL" > web/.env.production
          npm run build

      - name: 准备 Capacitor 工程
        run: |
          cd mobile
          node -e "const fs=require('fs');fs.rmSync('www',{recursive:true,force:true});fs.cpSync('../web/dist','www',{recursive:true});"
          npm install
          npx cap add android
          npx cap sync android

      - name: 构建 APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: zhidian-starmap-apk
          path: mobile/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
