# 自动构建「手机客户端 APK」（GitHub 云端构建，无需你本地装 Android SDK）
# 触发方式：仓库页面 → Actions → 选 “Build Android APK” → Run workflow → 跑完在该次运行里下载 APK
#
# 说明：不用 android-actions/setup-android（它默认要装已被移除的 "tools" 包会失败），
#       直接使用 GitHub 运行器预装的 Android SDK，并补装 Capacitor 8 需要的 API 36。
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      terminal_url:
        description: '客户端默认指向的终端地址（留空则用仓库变量 TERMINAL_URL / 默认线上地址）'
        required: false
        default: ''

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 准备 Android SDK（补装 API 36 并接受许可）
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$(command -v sdkmanager || true)"
          [ -x "$SM" ] || SM="$(find "$SDK" -name sdkmanager -type f 2>/dev/null | sort | tail -1)"
          echo "SDK 目录：$SDK"
          echo "sdkmanager：$SM"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "=== 已安装组件 ==="
          "$SM" --list_installed || true

      - name: 安装依赖（跳过 Electron 大文件下载）
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: 写入终端地址并构建前端
        env:
          INPUT_URL: ${{ github.event.inputs.terminal_url }}
          VAR_URL: ${{ vars.TERMINAL_URL }}
        run: |
          URL="${INPUT_URL:-${VAR_URL:-https://aimakestudymap.online}}"
          echo "客户端默认指向：$URL"
          echo "VITE_TERMINAL_URL=$URL" > web/.env.production
          npm run build

      - name: 准备 Capacitor 工程
        run: |
          cd mobile
          node -e "const fs=require('fs');fs.rmSync('www',{recursive:true,force:true});fs.cpSync('../web/dist','www',{recursive:true});"
          npm install
          npx cap add android
          npx cap sync android

      - name: 指定 SDK 路径并构建 APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > mobile/android/local.properties
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: zhidian-starmap-apk
          path: mobile/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
