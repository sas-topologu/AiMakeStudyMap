# 知识星图 Nginx 反向代理模板（VPS 自部署）
# 用 Certbot 自动配 SSL 时可简化：先放本文件到 sites-available 指向 3000，
# 再 `sudo certbot --nginx -d 你的域名`，由 Certbot 补上 HTTPS 段并启用。
#
# 放置：sudo tee /etc/nginx/sites-available/starmap < 本文件
# 启用：sudo ln -s /etc/nginx/sites-available/starmap /etc/nginx/sites-enabled/starmap && sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name 你的域名;   # 改成你的域名；无域名可先留空/用服务器IP

    # 后端转给 3000 端口的服务，并保持原始 Host（OAuth/重定向需要）
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    client_max_body_size 20m;   # 允许上传二创资源等较大内容
}
