<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300">
  <!-- 两球间的万有引力：F=Gm₁m₂/r² -->
  <rect width="480" height="300" fill="#0d1226" rx="8"/>

  <!-- 球 1 -->
  <circle cx="130" cy="150" r="50" fill="#1b2440" stroke="#7cc7ff" stroke-width="2"/>
  <text x="112" y="158" fill="#c8d0e8" font-size="16" font-family="sans-serif">m₁</text>

  <!-- 球 2 -->
  <circle cx="350" cy="150" r="50" fill="#1b2440" stroke="#7cc7ff" stroke-width="2"/>
  <text x="332" y="158" fill="#c8d0e8" font-size="16" font-family="sans-serif">m₂</text>

  <!-- 距离 r -->
  <line x1="180" y1="150" x2="300" y2="150" stroke="#8892b0" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="218" y="142" fill="#8892b0" font-size="14" font-family="sans-serif">r</text>

  <!-- m1 对 m2 的引力 F：向右 -->
  <line x1="180" y1="120" x2="295" y2="120" stroke="#ff8fa3" stroke-width="3"/>
  <polygon points="302,120 288,114 288,126" fill="#ff8fa3"/>
  <text x="212" y="112" fill="#ff8fa3" font-size="14" font-family="sans-serif">F（m₁ 对 m₂）</text>

  <!-- m2 对 m1 的引力 F'：向左 -->
  <line x1="300" y1="185" x2="185" y2="185" stroke="#ffd166" stroke-width="3"/>
  <polygon points="178,185 192,179 192,191" fill="#ffd166"/>
  <text x="212" y="204" fill="#ffd166" font-size="14" font-family="sans-serif">F′（m₂ 对 m₁）</text>

  <!-- 标题 -->
  <text x="60" y="270" fill="#c8d0e8" font-size="13" font-family="sans-serif">万有引力定律：F=Gm₁m₂/r²，任何两个物体间都存在相互吸引力</text>
</svg>
